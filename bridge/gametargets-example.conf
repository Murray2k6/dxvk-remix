# this is basically a .ini file
# section names turn into game project names
# each game needs a path and a commandline relative to that path

# NOTE: This is kept separate from the root directory's gametargets.conf
#       because the bridge build needs different outputdir from the dxvk
#       build.  Also, any 64 bit targets should only be in the root
#       gametargets.conf.

# Old way of copying to _output
# [Remix]
# outputdir: ..\_output
# workingdir: ..\_output
# commandline: nope.exe


# [MyGame]
# outputdir: C:\Games\MyGame\bin
# workingdir: C:\Games\MyGame
# commandline: MyGame.exe -window -w 1920 -h 1080